  # 4G, CI fails when the budget is exceeded). Added in phase 2, once the public site exists:
  #   lighthouse:
  #     name: Lighthouse budget
  #     needs: build
  #     runs-on: ubuntu-latest
  #     steps:
  #       - start CarRental.Web (Testcontainers SQL, Seed__Demo=true) or target the recette URL
  #       - run Lighthouse CI (action pinned to a commit SHA) on /fr, /fr/reserver... with
  #         .github/lighthouse/budget.json (LCP, total byte weight, no render-blocking JS)
  #       - upload the Lighthouse reports as an artifact
  # Deliberately not declared yet so that CI does not fail before the site exists.
